[project]
name = "realty-map"
version = "0.1.0"
description = "Local housing market metrics aggregated from multiple public sources"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
realtymap = "realtymap.__main__:main"

[tool.setuptools]
packages = ["realtymap", "realtymap.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
